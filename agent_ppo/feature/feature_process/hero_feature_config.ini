[feature_config]
is_hero_alive = one_hot:1:eq
location_x = min_max:-60000:60000
location_z = min_max:-60000:60000
hp_rate = min_max:0:1
mp_rate = min_max:0:1
level = min_max:1:15
move_speed = min_max:0:1000
phy_attack = min_max:0:1000
phy_defense = min_max:0:1000
attack_speed = min_max:0:200
phy_suck = min_max:0:100
cool_down_reduce = min_max:0:40
has_revive_item = one_hot:1:eq
money = min_max:0:20000
exp_progress = min_max:0:15
skill1_cd = min_max:0:1
skill2_cd = min_max:0:1
skill3_cd = min_max:0:1
summon_cd = min_max:0:1
dist_to_enemy = min_max:0:30000
passive_stack = min_max:0:1

[feature_functions]
is_hero_alive = is_alive
location_x = get_location_x
location_z = get_location_z
hp_rate = get_hp_rate
mp_rate = get_mp_rate
level = get_level
move_speed = get_move_speed
phy_attack = get_phy_attack
phy_defense = get_phy_defense
attack_speed = get_attack_speed
phy_suck = get_phy_suck
cool_down_reduce = get_cool_down_reduce
has_revive_item = get_has_revive_item
money = get_money
exp_progress = get_exp_progress
skill1_cd = get_skill1_cd
skill2_cd = get_skill2_cd
skill3_cd = get_skill3_cd
summon_cd = get_summon_cd
dist_to_enemy = get_dist_to_enemy
passive_stack = get_passive_stack
